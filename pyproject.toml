[project]
name = "django-task-queue"
version = "0.1.0"
description = "Async image resizing API with production-ready background task processing. Features retry logic with exponential backoff, idempotent task handling, and automated cleanup for long-term operation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.5.3",
    "djangorestframework>=3.16.1",
    "pillow>=12.0.0",
    "redis>=7.0.1",
]
